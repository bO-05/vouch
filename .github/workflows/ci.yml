name: Vouch Protocol CI & Verifiable Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 18.x, 20.x ]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Compile TypeScript & Vite Bundle
        run: npm run build

      - name: 🚀 Start Backend Server
        run: |
          nohup npm start > server.log 2>&1 &
          echo "Waiting for server to become healthy on port 3001..."
          HEALTHY=false
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:3001/api/health > /dev/null || curl -s -f http://localhost:3001/api/health > /dev/null; then
              echo "Server is healthy and responding!"
              HEALTHY=true
              break
            fi
            sleep 1
          done
          if [ "$HEALTHY" = "false" ]; then
            echo "❌ Backend server failed to start within 30 seconds. Dumping server.log:"
            cat server.log
            exit 1
          fi

      - name: 🧪 Run E2E Integration Suite (23 Tests)
        run: npm run test:e2e
        env:
          TEST_SERVER_URL: http://127.0.0.1:3001
          SOLANA_RPC_URL: https://api.devnet.solana.com

      - name: 🎙️ Run Interactive Judge Tour CLI (12 Stages)
        run: npm run demo
        env:
          TEST_SERVER_URL: http://127.0.0.1:3001
          SOLANA_RPC_URL: https://api.devnet.solana.com
